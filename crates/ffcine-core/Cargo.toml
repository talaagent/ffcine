[package]
name = "ffcine-core"
description = "ffcine core types: errors, colour spaces, 3D LUTs, media info, 2D geometry, param tracks and expressions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/ffcine-core"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# Without it the crate is `no_std` + `alloc`: `anim`, `color`, `geom`, `profile`, the `bmff` types
# and `Error`. `std` adds the file readers (`bmff::read`, `wav`), `.cube` LUTs (`lut`), probed
# media info (`MediaInfo`), camera profiles and LUT discovery (`camera`), and the `Io`,
# `CubeParse` and `Import` error variants.
std = ["thiserror/std", "serde_json/std", "num-traits/std"]
# `Error::Ffmpeg` (From<ffmpeg_next::Error>), for crates that call libav*.
ffmpeg = ["std", "dep:ffmpeg-next"]

[dependencies]
# Not the workspace specs: those turn on `std`.
thiserror = { version = "2.0.21", default-features = false }
serde_json = { version = "1.0.154", default-features = false, features = [
  "alloc",
  "preserve_order",
  "float_roundtrip",
] }
# Float maths (`sqrt`, `exp`, `powf`, ...) through `libm` without `std`.
num-traits = { version = "0.2.19", default-features = false, features = [
  "libm",
] }
ffmpeg-next = { workspace = true, optional = true }

[lints]
workspace = true

# docs.rs has no matching ffmpeg/libplacebo system libraries.
[package.metadata.docs.rs]
no-default-features = true
targets = ["x86_64-unknown-linux-gnu"]
