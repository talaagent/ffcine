[package]
name = "ffcine-filters"
description = "Frame filters (denoise, grain, ...) as Vulkan compute kernels that fuse into GPU passes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/ffcine-filters"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# Without it the crate is `no_std` + `alloc` (it does no I/O, and no float maths outside tests).
std = ["serde/std", "serde_json/std"]

[dependencies]
# Not the workspace specs: those turn on `std`.
serde = { version = "1.0.229", default-features = false, features = [
  "alloc",
  "derive",
] }
serde_json = { version = "1.0.154", default-features = false, features = [
  "alloc",
  "preserve_order",
  "float_roundtrip",
] }

[lints]
workspace = true

# docs.rs has no matching ffmpeg/libplacebo system libraries.
[package.metadata.docs.rs]
no-default-features = true
targets = ["x86_64-unknown-linux-gnu"]
