name: CI

on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: nix-community
          skipPush: true

      - name: cargo fmt
        run: nix develop --command cargo fmt --all --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo doc
        run: nix develop --command cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

      # No GPU on the runner: tests needing one skip themselves.
      - name: cargo nextest
        run: nix develop --command cargo nextest run --profile ci --workspace --all-features --locked

      - name: Rustdoc examples
        run: nix develop --command cargo test --workspace --all-features --doc --locked

      # Catches a broken crates.io package before release-plz publishes it.
      - name: cargo publish --dry-run
        run: nix develop --command cargo publish --workspace --dry-run --locked

      - name: nix build
        run: nix build .#ffcine --print-build-logs

      - name: nix flake check
        run: nix flake check --print-build-logs

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # The GPU stack is Linux only; the audio path has to keep building and passing on a Mac.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: cargo build (audio)
        run: nix develop .#audio --command cargo build -p ffcine-cli --no-default-features --features audio

      - name: cargo nextest (audio)
        run: nix develop .#audio --command cargo nextest run --profile ci -p ffcine-audio --locked

      - name: Rustdoc examples (audio)
        run: nix develop .#audio --command cargo test -p ffcine-audio --doc --locked

  portable-docs:
    name: docs.rs portable builds
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Deliberately outside Nix: prove these docs need no native headers/libraries.
      - name: Portable workspace and FFI documentation snapshot
        run: cargo doc --workspace --no-default-features --no-deps --locked
        env:
          DOCS_RS: "1"

  # ffcine-core, ffcine-filters and ffcine-timeline must build with no std at all.
  no-std:
    name: no_std build (wasm32v1-none)
    runs-on: ubuntu-latest
    env:
      # Every std-only crate; what is left is no_std + alloc without the default `std` feature.
      NO_STD_EXCLUDE: --exclude ffcine --exclude ffcine-assembly --exclude ffcine-audio --exclude ffcine-breakdown --exclude ffcine-cli --exclude ffcine-comp --exclude ffcine-delivery --exclude ffcine-hooks --exclude ffcine-import --exclude ffcine-ingest --exclude ffcine-reframe --exclude ffcine-render --exclude ffcine-stabilize --exclude ffcine-text --exclude ffcine-triage --exclude ffcine-libplacebo-sys
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: nix-community
          skipPush: true

      - name: cargo build (wasm32v1-none)
        run: nix develop --command cargo build --workspace $NO_STD_EXCLUDE --no-default-features --target wasm32v1-none --locked

  # The same crates' tests with `std` off; std-only tests are cfg-gated or `required-features`.
  no-std-test:
    name: no_std tests (host, --no-default-features)
    runs-on: ubuntu-latest
    env:
      # Every std-only crate; what is left is no_std + alloc without the default `std` feature.
      NO_STD_EXCLUDE: --exclude ffcine --exclude ffcine-assembly --exclude ffcine-audio --exclude ffcine-breakdown --exclude ffcine-cli --exclude ffcine-comp --exclude ffcine-delivery --exclude ffcine-hooks --exclude ffcine-import --exclude ffcine-ingest --exclude ffcine-reframe --exclude ffcine-render --exclude ffcine-stabilize --exclude ffcine-text --exclude ffcine-triage --exclude ffcine-libplacebo-sys
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: nix-community
          skipPush: true

      - name: cargo test --no-default-features
        run: nix develop --command cargo test --workspace $NO_STD_EXCLUDE --no-default-features --locked

  # The one check branch protection requires.
  ci:
    if: always()
    needs: [nix, deny, macos, portable-docs, no-std, no-std-test]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
